<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skycourier: Valley Run — a bush-plane flight game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>✈</text></svg>">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a1220;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a1220;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    touch-action: none;
    cursor: crosshair;
  }
  #mute-note {
    position: fixed;
    left: 196px;
    bottom: 10px;
    color: rgba(255, 255, 255, 0.55);
    font-size: 12px;
    pointer-events: none;
    z-index: 2;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>
<div id="mute-note">sound on (M)</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
